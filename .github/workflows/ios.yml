name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Compiles the iOS app on a cloud Mac to prove it builds. Signing and the App Store upload
# get added once the Apple Developer account exists (see STORES.md).
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci
      - run: npm run sync

      - name: Build for simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0
